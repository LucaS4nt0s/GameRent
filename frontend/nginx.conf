server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos básicos de segurança do site
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rotas internas do catálogo (só o rental-service chama, pela rede do Docker):
    # nunca ficam expostas ao navegador, mesmo que o SERVICE_TOKEN não esteja configurado.
    location ~ ^/api/catalog/games/[^/]+/(reserve|release)/?$ {
        return 403;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/rental/ {
        proxy_pass http://rental-service:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
