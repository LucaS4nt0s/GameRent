server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos básicos de segurança do site
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão (o CloudFront também comprime, mas assim o acesso direto fica leve)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rotas internas do catálogo (só o rental-service chama, pela rede do Docker):
    # nunca ficam expostas ao navegador, mesmo que o SERVICE_TOKEN não esteja configurado.
    location ~ ^/api/catalog/games/[^/]+/(reserve|release)/?$ {
        return 403;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:8001/;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/rental/ {
        proxy_pass http://rental-service:8002/;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Arquivos do build têm hash no nome: podem ficar em cache por 1 ano
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html nunca fica em cache, para cada deploy aparecer na hora
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
